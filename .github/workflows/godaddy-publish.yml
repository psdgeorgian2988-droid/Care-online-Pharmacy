name: Publish to GoDaddy

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Set to 1 to publish production and attach the domain"
        required: false
        default: "1"
      domain:
        description: "Hostname to attach (apex plus www)"
        required: false
        default: "medihome.co.in"
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require GoDaddy token
        env:
          GDDY_PAT: ${{ secrets.GDDY_PAT }}
        run: |
          if [ -z "$GDDY_PAT" ]; then
            echo "Add repository secret GDDY_PAT, then merge to main or run this workflow again."
            echo "Create the token at https://developer.godaddy.com/personal-access-token"
            echo "Required scopes: hosting.application:read hosting.application:create hosting.source:write hosting.source:read hosting.deployment:execute hosting.subscription:read hosting.subscription:write hosting.domain:read hosting.domain:write domains.domain:read domains.dns:update"
            exit 1
          fi
      - name: Install gddy CLI
        run: |
          set -e
          ok=0
          for _ in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              https://github.com/godaddy/cli/releases/latest/download/install.sh \
              -o /tmp/gddy-install.sh; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          bash /tmp/gddy-install.sh
      - name: Publish
        env:
          GDDY_PAT: ${{ secrets.GDDY_PAT }}
          GODADDY_APP_ID: ${{ vars.GODADDY_APP_ID }}
          GODADDY_PUBLISH: ${{ github.event.inputs.publish || '1' }}
          GODADDY_DOMAIN: ${{ github.event.inputs.domain || 'medihome.co.in' }}
          PATH: /home/runner/.local/bin:/usr/bin:/bin
        run: |
          set +e
          bash scripts/godaddy-publish.sh > /tmp/godaddy-publish.log 2>&1
          code=$?
          set -e
          sed -E 's/gd_pat_[A-Za-z0-9._-]+/[token]/g' /tmp/godaddy-publish.log | tail -n 80
          if [ "$code" != "0" ]; then
            msg="$(sed -E 's/gd_pat_[A-Za-z0-9._-]+/[token]/g' /tmp/godaddy-publish.log | tail -c 1800 | tr '\n' ' ')"
            echo "::error title=GoDaddy publish failed::$msg"
            exit "$code"
          fi
