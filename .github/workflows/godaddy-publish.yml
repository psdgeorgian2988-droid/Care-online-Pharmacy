name: Publish to GoDaddy

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Set to 1 to promote PREVIEW to PUBLISH (needs a hosting plan)"
        required: false
        default: "0"
      domain:
        description: "Optional hostname to attach (e.g. medihome.co.in)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require GoDaddy token
        env:
          GDDY_PAT: ${{ secrets.GDDY_PAT }}
        run: |
          if [ -z "$GDDY_PAT" ]; then
            echo "Add repository secret GDDY_PAT (GoDaddy personal access token), then run this workflow again."
            exit 1
          fi
      - name: Install gddy CLI
        run: curl -fsSL https://github.com/godaddy/cli/releases/latest/download/install.sh | bash
      - name: Publish
        env:
          GDDY_PAT: ${{ secrets.GDDY_PAT }}
          GODADDY_APP_ID: ${{ vars.GODADDY_APP_ID }}
          GODADDY_PUBLISH: ${{ github.event.inputs.publish }}
          GODADDY_DOMAIN: ${{ github.event.inputs.domain }}
          PATH: /home/runner/.local/bin:/usr/bin:/bin
        run: bash scripts/godaddy-publish.sh
