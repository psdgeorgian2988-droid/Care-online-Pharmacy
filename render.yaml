services:
  - type: web
    name: medihome
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prebuilt
    healthCheckPath: /api/features
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MEDIHOME_HOST
        value: "0.0.0.0"
